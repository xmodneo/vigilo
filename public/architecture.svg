<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
<title id="t">Vigilo system architecture</title>
<desc id="d">A Next.js control plane and PostgreSQL store feed exact-job workers. Workers drive an isolated Vercel Sandbox baseline and a bounded Gemini investigation. Candidate generation, independent verification, and human review are implemented but not live-accepted.</desc>
